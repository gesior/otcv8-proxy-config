global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 300000

defaults
    log     global
    mode    tcp
    maxconn 300000
    timeout connect 4s
    timeout client  180s
    timeout server  180s
    timeout client-fin 30s
    timeout server-fin 30s

haproxy_ports_config
